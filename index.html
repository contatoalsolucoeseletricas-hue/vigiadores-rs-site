  window.filtrarMercado = function(tipo) {

      b.style.borderColor = 'rgba(255,255,255,0.15)';
      b.classList.remove('active');
    });
    const chip = document.getElementById('chip-' + tipo);
    if (chip) {
      chip.style.background = '#38bdf8';
      chip.style.color = '#0f172a';
      chip.style.borderColor = '#38bdf8';
      chip.classList.add('active');
    }

    const m = (DADOS && DADOS.mercado) ? DADOS.mercado : {};
    const todosItens = m.itens_rigorosos_doc111 || [];
    
    let itensFiltrados = todosItens;
    if (tipo === 'todos') {
      itensFiltrados = todosItens;
    } else if (tipo === 'insumos' || tipo === 'confeitaria') {
      itensFiltrados = todosItens.filter(i => {
        const cat = (i.categoria || '').toLowerCase();
        return cat.includes('confeitaria') || cat.includes('trufas') || cat.includes('insumos');
      });
    } else if (tipo === 'alimentos') {
      itensFiltrados = todosItens.filter(i => {
        const cat = (i.categoria || '').toLowerCase();
        return cat.includes('alimentos') || cat.includes('essenciais');
      });
    } else if (tipo === 'refrigerantes') {
      itensFiltrados = todosItens.filter(i => {
        const cat = (i.categoria || '').toLowerCase();
        const p = (i.produto || '').toLowerCase();
        const ehRefrigerante = cat.includes('refrigerantes') || cat.includes('bebidas') || p.includes('coca') || p.includes('pepsi') || p.includes('guaraná') || p.includes('fruki');
        const ehLeiteOuDoce = p.includes('leite') || p.includes('creme') || p.includes('chocolate') || p.includes('doce') || p.includes('chantilly');
        return ehRefrigerante && !ehLeiteOuDoce;
      });
    } else if (tipo === 'combustiveis') {
      itensFiltrados = todosItens.filter(i => {
        const cat = (i.categoria || '').toLowerCase();
        const p = (i.produto || '').toLowerCase();
        return cat.includes('combust') || p.includes('gasolina') || p.includes('etanol') || p.includes('diesel');
      });
    } else if (tipo === 'reciclagem') {
      itensFiltrados = todosItens.filter(i => {
        const cat = (i.categoria || '').toLowerCase();
        return cat.includes('reciclagem') || cat.includes('latas');
      });
    }

    if (containerMercado) {
      containerMercado.innerHTML = itensFiltrados.map(i => renderCardItemMercado(i)).join("");

<script>
  let itemAlertaAtual = null;

  function toggleFavorito(id, titulo) {
    let favs = JSON.parse(localStorage.getItem('favoritos_vigiadores') || '[]');
    const idx = favs.findIndex(x => x.id === id);
    if (idx >= 0) {
      favs.splice(idx, 1);
      alert(`Removido dos favoritos: ${titulo}`);
    } else {
      favs.push({ id, titulo, data: new Date().toLocaleDateString('pt-BR') });
      alert(`⭐ Salvo nos favoritos: ${titulo}`);
    }
    localStorage.setItem('favoritos_vigiadores', JSON.stringify(favs));
    atualizarBotoesFavoritos();
  }

  function atualizarBotoesFavoritos() {
    let favs = JSON.parse(localStorage.getItem('favoritos_vigiadores') || '[]');
    favs.forEach(f => {
      const btn = document.getElementById('fav_' + f.id.replace('/', '_'));
      if (btn) {
        btn.style.background = '#f59e0b';
        btn.style.color = '#0b0f17';
        btn.innerHTML = '<span>★ Salvo</span>';
      }
    });
  }

  function abrirModalAlerta(id, titulo, precoSugerido) {
    itemAlertaAtual = { id, titulo };
    document.getElementById('alertaItemNome').textContent = titulo;
    document.getElementById('inputPrecoAlvo').value = precoSugerido || 'R$ 0,00';
    document.getElementById('modalAlertaTelegram').style.display = 'flex';
  }

  function fecharModalAlerta() {
    document.getElementById('modalAlertaTelegram').style.display = 'none';
  }

  function salvarAlertaTelegram() {
    const preco = document.getElementById('inputPrecoAlvo').value.trim();
    const tg = document.getElementById('inputTelegramUser').value.trim();
    if (!tg) {
      alert('Por favor, informe seu @usuario ou ID do Telegram.');
      return;
    }
    let alertas = JSON.parse(localStorage.getItem('alertas_telegram_vigiadores') || '[]');
    alertas.push({ item: itemAlertaAtual, preco_alvo: preco, telegram: tg, data: new Date().toISOString() });
    localStorage.setItem('alertas_telegram_vigiadores', JSON.stringify(alertas));
    alert(`✅ Alerta ativado! Você será notificado no Telegram (${tg}) quando ${itemAlertaAtual.titulo} atingir ${preco}!`);
    fecharModalAlerta();
  }

  // Chamar ao carregar
  setTimeout(atualizarBotoesFavoritos, 500);
</script>
</body>

</html>
