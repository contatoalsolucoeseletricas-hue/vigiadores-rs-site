              <p class="card-desc" style="font-size: 12px; margin: 8px 0;">${g.desc}</p>
              <div class="card-meta">
                <span><strong>JID:</strong> <code>${g.jid}</code></span>
                <span><strong>Status:</strong> Escuta Passiva 100% Silenciosa</span>
              </div>
            </div>
          `).join("")}
        </div>

        <div class="section-title" style="margin-top: 32px;">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span>Repositórios Git & Códigos Garimpados</span>
        </div>
        <div class="card-grid">
          ${(id.repos || []).map(r => `
            <div class="vigiador-card">
              <div class="card-head">
                <h4 class="card-title">${r.titulo}</h4>
                <span class="badge badge-primary">${r.encaixe}</span>
              </div>
              <p class="card-desc" style="margin: 8px 0;">${r.resumo}</p>
              <a href="${r.url}" target="_blank" rel="noopener" class="action-btn">
                <span>Ver Repositório no GitHub</span>
                <svg class="icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            </div>
          `).join("")}
        </div>

        <div class="section-title" style="margin-top: 32px;">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Comandos e Mensagens do André Luís Salvos (Zero Descarte)</span>
        </div>
        <div class="card-grid">
          ${(id.mensagens_andre || []).map(m => `
            <div class="vigiador-card" style="border-left: 3px solid #38bdf8;">
              <div class="card-head">
                <h4 class="card-title" style="color: #38bdf8;">"${m.texto}"</h4>
                <span class="badge badge-warning">${m.projeto}</span>
              </div>
              <p class="card-desc" style="font-size: 12px; margin: 8px 0;"><strong>Contexto:</strong> ${m.contexto}</p>
              <div class="card-meta">
                <span><strong>Grupo:</strong> ${m.grupo}</span>
                <span><strong>Data:</strong> ${m.data}</span>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }
  }

  // Event Listeners
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      TAB_ATIVA = btn.dataset.tab;
      renderizarTab();
    });
  });

  document.getElementById("searchInput").addEventListener("input", () => {
    renderizarTab();
  });

  window.addEventListener("DOMContentLoaded", carregarDados);
</script>
</body>
</html>
